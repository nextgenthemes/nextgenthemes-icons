<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>NextGen Themes Icons Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .banner {
      position: relative;
      width: 1544px;
      height: 500px;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 30%, #0d1b2a 70%, #1b2838 100%);
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(100, 100, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(255, 100, 150, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(100, 200, 255, 0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .icon {
      position: absolute;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease, opacity 0.3s ease;
      cursor: pointer;
      opacity: 0;
      animation: iconAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .icon:hover {
      transform: scale(1.2) !important;
      filter: drop-shadow(0 8px 25px rgba(100, 200, 255, 0.4));
      z-index: 100;
    }

    .icon svg {
      width: 100%;
      height: 100%;
    }

    @keyframes iconAppear {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-30deg);
      }

      60% {
        opacity: 0.95;
        transform: scale(1.15) rotate(5deg);
      }

      100% {
        opacity: 1;
        transform: scale(var(--scale, 1)) rotate(var(--rotation, 0deg));
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) scale(var(--scale, 1)) rotate(var(--rotation, 0deg));
      }

      50% {
        transform: translateY(-10px) scale(var(--scale, 1)) rotate(var(--rotation, 0deg));
      }
    }

    .icon.floating {
      animation: iconAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        float 4s ease-in-out infinite;
      animation-delay: var(--delay, 0s), 1.5s;
    }
  </style>
</head>

    const banner = document.getElementById('banner');
    const placed = [];
    const BANNER_W = 1544;
    const BANNER_H = 500;
    const MIN_GAP = 30;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function overlaps(x, y, radius) {
      return placed.some(p => {
        const dx = x - p.x;
        const dy = y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < p.radius + radius + MIN_GAP;
      });
    }

    icons.forEach((icon, index) => {
      const size = random(40, 90);
      const radius = size / 2;
      let x, y, attempts = 0;
      const maxAttempts = 500;

      do {
        x = random(radius + 20, BANNER_W - radius - 20);
        y = random(radius + 20, BANNER_H - radius - 20);
        attempts++;
      } while (overlaps(x, y, radius) && attempts < maxAttempts);

      if (attempts >= maxAttempts) return;

      const rotation = random(-12, 12);
      const baseOpacity = random(0.65, 0.95);
      const delay = index * 0.08;

      placed.push({ x, y, radius });

      const el = document.createElement('div');
      el.className = 'icon floating';
      el.style.left = (x - radius) + 'px';
      el.style.top = (y - radius) + 'px';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.setProperty('--scale', size / 60);
      el.style.setProperty('--rotation', rotation + 'deg');
      el.style.setProperty('--base-opacity', baseOpacity);
      el.style.setProperty('--delay', delay + 's');
      el.title = icon.name;
      el.innerHTML = icon.svg;

      banner.appendChild(el);
    });
  </script>
